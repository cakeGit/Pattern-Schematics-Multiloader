pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {// https://mvnrepository.com/artifact/org.yaml/snakeyaml
        classpath  group: 'org.yaml', name: 'snakeyaml', version: '2.4'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}